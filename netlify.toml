# Netlify 部署配置：构建产物为纯静态站点（HashRouter，无需重写规则）
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# 安全响应头（本地优先应用；CSP 中 connect-src https: 覆盖用户自定义 AI 端点）
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https:; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'"

# 基元律动（TokenRhythm）API 代理：上游无 CORS 且带 CSRF 校验，
# 必须用 Edge Function 剥头转发（[[redirects]] 无法剥头），实现见 netlify/edge-functions/api-tr.ts
[[edge_functions]]
  path = "/tr/*"
  function = "api-tr"
